services:
  famslide:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      ICLOUD_ALBUM_URL: ${ICLOUD_ALBUM_URL:?Set ICLOUD_ALBUM_URL in .env}
      SYNC_INTERVAL: 15m
      HTTP_PORT: "8080"
      DATA_DIR: /data
      PRUNE_REMOVED_PHOTOS: "true"
      ENABLE_MANUAL_SYNC: ${ENABLE_MANUAL_SYNC:-false}
