<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1014"><title>Status · Famslide</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin"><main class="panel"><div class="eyebrow">FAMSLIDE / SYSTEM</div><header><div><h1>Frame status</h1><p id="subtitle">Checking the local library…</p></div><a class="view-link" href="/">View slideshow ↗</a></header><section class="stats"><div><span>Photos</span><strong id="photos">—</strong></div><div><span>Scenes</span><strong id="scenes">—</strong></div><div><span>Storage</span><strong id="disk">—</strong></div></section><section class="details"><div><span>Album</span><b id="album">—</b></div><div><span>Sync status</span><b id="state">—</b></div><div><span>Last successful sync</span><b id="last">—</b></div><div><span>Last changes</span><b id="changes">—</b></div></section><p id="error" class="error" hidden></p><button id="sync" hidden>Sync now <span>↗</span></button><p class="note">The slideshow uses locally cached images and keeps playing through network interruptions.</p></main><script>const $=id=>document.getElementById(id);async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'}),s=await r.json();$('subtitle').textContent=s.album_name||'Waiting for the first sync';$('photos').textContent=s.photo_count.toLocaleString();$('scenes').textContent=s.scene_count.toLocaleString();$('disk').textContent=(s.disk_bytes/1024/1024/1024).toFixed(2)+' GB';$('album').textContent=s.album_name||'—';$('state').textContent=s.sync_status;$('last').textContent=s.last_sync&&s.last_sync!=='0001-01-01T00:00:00Z'?new Date(s.last_sync).toLocaleString():'Never';$('changes').textContent=`${s.last_sync_added} added · ${s.last_sync_updated} updated`;$('error').hidden=!s.last_error;$('error').textContent=s.last_error||'';$('sync').hidden=!s.manual_sync_enabled;$('sync').disabled=s.sync_status==='running'}catch(e){$('subtitle').textContent='Cannot reach server'}}$('sync').onclick=async()=>{await fetch('/api/sync',{method:'POST'});refresh()};refresh();setInterval(refresh,5000)</script></body></html>
